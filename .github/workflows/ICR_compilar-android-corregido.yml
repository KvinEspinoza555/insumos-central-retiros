name: Compilar solo Android corregido

# Lanzamiento manual: no compila Windows ni cambia datos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK de pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir codigo en el runner temporal
        run: unzip -oq ICR_Codigo_Instaladores_Para_GitHub.zip -d .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Preparar Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Instalar herramientas
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Preparar aplicacion
        working-directory: mobile
        run: npm run prepare:web
      - name: Crear proyecto Android
        working-directory: mobile
        run: npx cap add android
      - name: Sincronizar
        working-directory: mobile
        run: npx cap sync android
      - name: Compilar APK
        working-directory: mobile
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ICR-Android-APK-Pruebas
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
